<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stav platby — MemoryOrb</title><link rel="stylesheet" href="styles.css"><body><main class="legal-main"><a class="brand" href="/">MemoryOrb</a><h1 id="result">Overujeme platbu…</h1><p id="message" role="status">Počkajte, prosím.</p><a class="btn btn-gold" href="/">Späť do obchodu →</a></main><script>
fetch('/api/session?id='+encodeURIComponent(new URLSearchParams(location.search).get('session_id')||'')).then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>{document.querySelector('#result').textContent=s.paid?'Ďakujeme za objednávku.':'Platba sa ešte spracúva.';document.querySelector('#message').textContent=s.paid?'Vaša platba bola potvrdená.':'Stav platby si môžete overiť opätovným načítaním stránky.';if(s.paid)localStorage.removeItem('memoryorb-cart-v1')}).catch(()=>{document.querySelector('#result').textContent='Platbu sa nepodarilo overiť.';document.querySelector('#message').textContent='Skúste stránku načítať znova. Neodosielajte druhú platbu, kým si neoveríte prvú.'});
</script></body></html>
