<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status — MemoryOrb</title><link rel="stylesheet" href="styles.css"><body><main class="legal-main"><a class="brand" href="/">MemoryOrb</a><h1 id="result">Checking your payment…</h1><p id="message" role="status">Please wait.</p><a class="btn btn-gold" href="/">Back to shop →</a></main><script>
fetch('/api/session?id='+encodeURIComponent(new URLSearchParams(location.search).get('session_id')||'')).then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>{document.querySelector('#result').textContent=s.paid?'Thank you for your order.':'Your payment is still processing.';document.querySelector('#message').textContent=s.paid?'Your payment has been confirmed.':'Refresh this page to check your payment status.';if(s.paid)localStorage.removeItem('memoryorb-cart-v1')}).catch(()=>{document.querySelector('#result').textContent='Unable to verify payment.';document.querySelector('#message').textContent='Please refresh the page. Check your first payment before trying to pay again.'});
</script></body></html>
